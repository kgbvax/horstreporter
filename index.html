<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>horstreporter - HF Propagation Heatmap</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="controls">
        <div class="controls-header">
            <h2>horstreporter</h2>
            <button id="theme-toggle" title="Toggle theme"></button>
        </div>
        <form id="fetch-form">
            <div class="target-input-container">
                <input type="text" id="target" placeholder="Callsign or Locator (e.g. W1AW, JO, FN31, JO32WE)" tooltip="You can use fields, squares, subsquares or callsigns" />
                <button type="button" id="btn-geo" title="Use current location">📍</button>
                <button type="submit">Go</button>
            </div>
            <label>Minutes:
                <input type="number" id="minutes" value="15" min="1" max="60" />
            </label>
            <label>
                <input type="checkbox" id="filter-0db" checked /> SSB level only
            </label>
            <label for="style-select">Style:</label>
<select id="style-select">
    <option value="grid-snr" selected>Grid (SNR)</option>
    <option value="grid-age">Grid (Age)</option>
    <option value="aggregated">Aggregated Fields</option>
    <option value="heatmap">Heatmap</option>
</select>
<div class="form-sections">
            <div id="band-container">
                <label class="band-label" style="background-color: #555555; color: white;"><input type="radio" name="band" value="all" checked> All Bands</label>
                <label class="band-label" style="background-color: #800080; color: white;"><input type="radio" name="band" value="80m"> 80m</label>
                <label class="band-label" style="background-color: #0000FF; color: white;"><input type="radio" name="band" value="40m"> 40m</label>
                <label class="band-label" style="background-color: #008000; color: white;"><input type="radio" name="band" value="20m"> 20m</label>
                <label class="band-label" style="background-color: #808000; color: white;"><input type="radio" name="band" value="17m"> 17m</label>
                <label class="band-label" style="background-color: #FFA500;"><input type="radio" name="band" value="15m"> 15m</label>
                <label class="band-label" style="background-color: #00FFFF;"><input type="radio" name="band" value="12m"> 12m</label>
                <label class="band-label" style="background-color: #FF0000; color: white;"><input type="radio" name="band" value="10m"> 10m</label>
                <label class="band-label" style="background-color: #FF00FF; color: white;"><input type="radio" name="band" value="6m"> 6m</label>
            </div>
            <div class="action-buttons">
                <button type="button" id="btn-cycle" title="Cycle Active Bands">▶️</button>
            </div>
</div>
        </form>
        <div id="stream-status">Status: Not subscribed</div>
        <div id="server-stats"></div>
    </div>
    <div id="map"></div>
    <div id="tooltip"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="app.js"></script>
</body>
</html>
